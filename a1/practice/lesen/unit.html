  <script>
    (function () {
      var want = new URLSearchParams(location.search).get("u");
      var i = LESEN_UNITS.findIndex(function (u) { return u.id === want; });
      if (i < 0) i = 0;

      var unit = LESEN_UNITS[i];
      document.title = unit.title + " — Lesen — Übungsbuch — Deutsch Ecke";
      DE_PRACTICE.mount(unit, document.getElementById("unit-host"));

      var prev = LESEN_UNITS[i - 1];
      var next = LESEN_UNITS[i + 1];
      var nav = document.getElementById("unit-nav");
      var h = "";
      if (prev) h += '<a href="unit.html?u=' + prev.id + '">&larr; ' + prev.title + "</a>";
      h += '<span class="sp"></span>';
      h += '<a href="index.html">Alle Einheiten</a>';
      if (next) h += '<a href="unit.html?u=' + next.id + '">' + next.title + " &rarr;</a>";
      nav.innerHTML = h;
    })();
  </script>
